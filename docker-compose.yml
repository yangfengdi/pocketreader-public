services:
  pocketreader:
    build: .
    container_name: pocketreader
    restart: unless-stopped
    ports:
      - "127.0.0.1:4780:4780"
    env_file:
      - /etc/apps/pocketreader/pocketreader.env
    volumes:
      - /var/lib/apps/pocketreader:/data
      - /var/log/apps/pocketreader:/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4780/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

