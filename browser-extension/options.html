<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>PocketReader 设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>PocketReader</h1>
      <form id="settings-form">
        <label>
          PocketReader 地址
          <input id="base-url" name="baseUrl" autocomplete="off" required>
        </label>
        <label>
          IMPORT_TOKEN
          <input id="import-token" name="importToken" autocomplete="off" required>
        </label>
        <label>
          默认声音
          <select id="voice" name="voice">
            <option value="zh-CN-XiaoxiaoNeural">中文女声 - Xiaoxiao</option>
            <option value="zh-CN-XiaoyiNeural">中文女声 - Xiaoyi</option>
            <option value="zh-CN-YunxiNeural">中文男声 - Yunxi</option>
            <option value="zh-CN-YunjianNeural">中文男声 - Yunjian</option>
            <option value="zh-TW-HsiaoChenNeural">台湾中文女声 - HsiaoChen</option>
            <option value="en-US-EmmaMultilingualNeural">中英混合女声 - Emma</option>
            <option value="en-US-AriaNeural">英文女声 - Aria</option>
            <option value="en-US-GuyNeural">英文男声 - Guy</option>
          </select>
        </label>
        <label>
          默认朗读范围
          <select id="reader-mode" name="readerMode">
            <option value="all">问题和 AI 回复</option>
            <option value="assistant">只读 AI 回复</option>
          </select>
        </label>
        <label class="checkbox-label">
          <input id="split-by-turn" name="splitByTurn" type="checkbox">
          <span>默认每个回合生成一个独立音频</span>
        </label>
        <button type="submit">保存设置</button>
        <p id="status" role="status"></p>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
